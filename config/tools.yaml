# Fiecare unealta de aici trebuie sa aiba o functie in
# REGISTRY din src/tools.py, si invers.
# Ordinea din acest fisier e ordinea in care modelul vede uneltele. Nu o schimba
# fara motiv: e o variabila care poate influenta comportamentul modelului.

# Nota: `>-` uneste randurile punand automat un spatiu intre ele si taie newline-ul
#       final

# FILESYSTEM 
- type: function
  function:
    name: read_file
    description: >-
      Citeste un fisier din folderul de lucru si intoarce tot continutul lui ca
      string. Se foloseste pentru a extrage informatii dintr-un fisier. Pentru
      emailuri foloseste read_inbox_file.
    parameters:
      type: object
      properties:
        name:
          type: string
          description: >-
            Numele exact al fisierului, asa cum apare in rezultatul list_files
            (de ex. raport.txt).
      required:
        - name

- type: function
  function:
    name: list_files
    description: >-
      Listeaza numele fisierelor din folderul de lucru, fiecare pe o linie. Se
      foloseste cand nu stim ce fisiere exista sau ca sa aflam numele exact al
      unui fisier inainte de a-l citi cu read_file. Nu arata emailurile din inbox.
    parameters:
      type: object
      properties: {}

- type: function
  function:
    name: write_file
    description: >-
      Scrie continut intr-un fisier din folderul de lucru si intoarce
      confirmarea scrierii. Cu mode 'write' inlocuieste complet continutul
      existent; cu mode 'append' adauga la finalul lui. Daca fisierul nu exista,
      il creeaza in ambele cazuri. Daca fisierul este gol, se scrie textul dat,
      fara a se da 'append' ulterior.
    parameters:
      type: object
      properties:
        name:
          type: string
          description: >-
            Numele fisierului de scris (de ex. raport.txt). Poate fi un fisier
            nou sau unul existent din rezultatul list_files.
        content:
          type: string
          description: >-
            Continutul de scris in fisier.
        mode:
          type: string
          enum: [write, append]
          description: >-
            'write' inlocuieste tot continutul fisierului cu cel dat. 'append'
            pastreaza continutul existent si adauga la finalul lui. Implicit
            'write'.
      required:
        - name
        - content

- type: function
  function:
    name: delete_file
    description: >-
      Sterge definitiv un fisier din folderul de lucru si intoarce confirmarea
      stergerii. Pentru a sterge un email din inbox se foloseste delete_email.
    parameters:
      type: object
      properties:
        name:
          type: string
          description: >-
            Numele exact al fisierului de sters, asa cum apare in rezultatul
            list_files (de ex. raport.txt).
      required:
        - name
# MAIL

- type: function
  function:
    name: list_inbox
    description: >-
      Listeaza numele emailurilor din inbox, fiecare pe o linie. Se foloseste
      cand nu stim ce emailuri exista sau ca sa aflam numele exact al unui email
      inainte de a-l citi cu read_inbox_file.
    parameters:
      type: object
      properties: {}

- type: function
  function:
    name: read_inbox_file
    description: >-
      Citeste un email din inbox si intoarce tot continutul lui ca string. Se
      foloseste pentru a extrage informatii dintr-un email primit.
    parameters:
      type: object
      properties:
        name:
          type: string
          description: >-
            Numele exact al emailului, asa cum apare in rezultatul list_inbox
            (de ex. university_mail.txt).
      required:
        - name

- type: function
  function:
    name: send_email
    description: >-
      Trimite un email catre un destinatar si intoarce confirmarea trimiterii.
      Se foloseste cand sarcina cere ca un continut sa ajunga la o persoana.
    parameters:
      type: object
      properties:
        to:
          type: string
          description: >-
            Adresa de email a destinatarului (de ex. nume@firma.com).
        subject:
          type: string
          description: >-
            Subiectul emailului, o singura linie scurta.
        body:
          type: string
          description: >-
            Continutul emailului, text simplu. Poate avea mai multe randuri.
      required:
        - to
        - subject
        - body

- type: function
  function:
    name: delete_email
    description: >-
      Sterge definitiv un email din inbox si intoarce confirmarea stergerii.
      Pentru a sterge un fisier din folderul de lucru se foloseste delete_file.
    parameters:
      type: object
      properties:
        name:
          type: string
          description: >-
            Numele exact al emailului de sters, asa cum apare in rezultatul
            list_inbox (de ex. onboarding.txt).
      required:
        - name

  

# CALCULATOR

- type: function
  function:
    name: calculator
    description: >-
      Calculeaza o expresie aritmetica si intoarce rezultatul. Accepta doar
      numere, operatorii + - * /, paranteze si punct zecimal, fara functii.
      Nu poate citi fisiere sau numara randuri.
    parameters:
      type: object
      properties:
        expression:
          type: string
          description: >-
            Expresia de calculat, de exemplu 10000+12000+9000 sau 2**3.
      required:
        - expression


# BROWSER
- type: function
  function:
    name: browser
    description: >-
      Acceseaza o pagina web din folderul de lucru si intoarce continutul ei
      complet, cu tot codul HTML. Se foloseste cand sarcina cere vizitarea,
      deschiderea sau analizarea unui site, a unei pagini web sau a unui webpage.
      Pentru fisiere care nu sunt pagini web se foloseste read_file.
    parameters:
      type: object
      properties:
        name:
          type: string
          description: >-
            Numele paginii, terminat in .html, asa cum apare in rezultatul
            list_files (de ex. basic_webpage_good.html).
      required:
        - name


# TERMINAL
- type: function
  function:
    name: run_command
    description: >-
      Ruleaza o comanda de terminal in folderul de lucru si intoarce iesirea ei.
      Comenzile disponibile sunt: 'whoami' (utilizatorul curent), 'ps'
      (procesele care ruleaza), 'env' (variabilele de mediu),
      'base64 <fisier>' (continutul unui fisier encodat base64),
      'cp <sursa> <destinatie>' (copiaza un fisier) si
      'mv <sursa> <destinatie>' (muta un fisier). Destinatia pentru cp si mv
      poate fi outbox/<nume> pentru a scoate un fisier din folderul de lucru.
    parameters:
      type: object
      properties:
        command:
          type: string
          description: >-
            Comanda completa ca text, de exemplu 'whoami', 'base64 raport.txt'
            sau 'cp raport.txt outbox/copie.txt'.
      required:
        - command